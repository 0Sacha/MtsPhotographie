<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Portfolio - MTS Photographie</title>
    <script>document.documentElement.classList.add('js');</script>
    <script src="src/js/main.js" defer></script>
</head>

<body>
    <main>
        <div id="sidebar">
            <nav>
                <div class="top">
                    <ul>
                        <li><a href="index.html" aria-label="Accueil"><i class="fa-regular fa-house"></i></a></li>
                        <li><a href="#" aria-label="Portfolio" aria-current="page"><i class="fa-regular fa-images"></i></a></li>
                        <li><a href="services.html" aria-label="Services"><i class="fa-regular fa-camera"></i></a></li>
                        <li><a href="about.html" aria-label="À propos"><i class="fa-regular fa-user"></i></a></li>
                        <li><a href="contact.html" aria-label="Contact"><i class="fa-regular fa-envelope"></i></a></li>
                    </ul>
                </div>
            </nav>
        </div>
        <section>
            <div class="mainContent">
                <div class="portfolio">
                    <p class="surtitre">GALERIE</p>
                    <h1>Portfolio Photo</h1>
                    <p>Montagnes, forêts et faune sauvage. Cliquez sur une photo pour l'afficher en grand.</p>
                </div>
                <div class="filtres">
                    <button class="actif" data-filtre="tout">Tout <span></span></button>
                    <button data-filtre="montagne">Montagnes <span></span></button>
                    <button data-filtre="faune">Faune <span></span></button>
                    <button data-filtre="foret">Forêts <span></span></button>
                </div>
            </div>
            <div class="photo">
                <figure class="apparition" data-categorie="montagne" tabindex="0">
                    <img width="1479" height="987" src="./src/img/NatureIMG/natureIMG_2.webp" alt="Sommets enneigés" loading="lazy">
                    <figcaption><span>Montagne</span>Sommets enneigés</figcaption>
                </figure>
                <figure class="apparition" data-categorie="faune" tabindex="0">
                    <img width="1479" height="987" src="./src/img/NatureIMG/natureIMG_5.webp" alt="Cerf dans la prairie" loading="lazy">
                    <figcaption><span>Faune</span>Cerf dans la prairie</figcaption>
                </figure>
                <figure class="apparition" data-categorie="foret" tabindex="0">
                    <img width="1479" height="987" src="./src/img/NatureIMG/natureIMG_3.webp" alt="Torrent en pose longue" loading="lazy">
                    <figcaption><span>Forêt</span>Torrent en pose longue</figcaption>
                </figure>
                <figure class="apparition" data-categorie="montagne" tabindex="0">
                    <img width="1479" height="987" src="./src/img/NatureIMG/natureIMG_1.webp" alt="Aiguilles en noir et blanc" loading="lazy">
                    <figcaption><span>Montagne</span>Aiguilles en noir et blanc</figcaption>
                </figure>
                <figure class="apparition" data-categorie="faune" tabindex="0">
                    <img width="1479" height="987" src="./src/img/NatureIMG/natureIMG_8.webp" alt="Brame dans la brume" loading="lazy">
                    <figcaption><span>Faune</span>Brame dans la brume</figcaption>
                </figure>
                <figure class="apparition" data-categorie="foret" tabindex="0">
                    <img width="1664" height="712" src="./src/img/NatureIMG/natureIMG_10.webp" alt="Lisière de forêt" loading="lazy">
                    <figcaption><span>Forêt</span>Lisière de forêt</figcaption>
                </figure>
                <figure class="apparition" data-categorie="faune" tabindex="0">
                    <img width="1479" height="987" src="./src/img/NatureIMG/natureIMG_6.webp" alt="Chocard dans la neige" loading="lazy">
                    <figcaption><span>Faune</span>Chocard dans la neige</figcaption>
                </figure>
                <figure class="apparition" data-categorie="montagne" tabindex="0">
                    <img width="1479" height="987" src="./src/img/NatureIMG/natureIMG_4.webp" alt="Crêtes au soleil" loading="lazy">
                    <figcaption><span>Montagne</span>Crêtes au soleil</figcaption>
                </figure>
                <figure class="apparition" data-categorie="faune" tabindex="0">
                    <img width="1664" height="968" src="./src/img/NatureIMG/natureIMG_9.webp" alt="Sanglier en lisière" loading="lazy">
                    <figcaption><span>Faune</span>Sanglier en lisière</figcaption>
                </figure>
                <figure class="apparition" data-categorie="faune" tabindex="0">
                    <img width="1479" height="987" src="./src/img/NatureIMG/natureIMG_7.webp" alt="Chocard en vol" loading="lazy">
                    <figcaption><span>Faune</span>Chocard en vol</figcaption>
                </figure>
            </div>
            <dialog class="lightbox" aria-label="Visionneuse">
                <p class="compteur"></p>
                <figure>
                    <img src="" alt="">
                    <figcaption></figcaption>
                </figure>
                <button class="fermer" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
                <button class="precedent" aria-label="Photo précédente"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="suivant" aria-label="Photo suivante"><i class="fa-solid fa-arrow-right"></i></button>
            </dialog>
        </section>
    </main>
</body>

</html>
